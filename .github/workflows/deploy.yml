name: Production Health Check

# Deployments are handled automatically by Vercel's Git integration
# (every push to main triggers a production deploy, PRs get preview
# deploys). This workflow just verifies production is healthy after
# the deploy goes out.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  post-deploy-checks:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Vercel deployment to go live
        run: sleep 90

      - name: Check production site health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -L https://of-blood.com)
          if [ $response -eq 200 ]; then
            echo "✅ Production site is healthy (HTTP $response)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Production site health check failed (HTTP $response)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Check key pages
        run: |
          pages=("/" "/music" "/tour" "/videos" "/photos" "/contact")
          echo "### Page Health Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          failed=0
          for page in "${pages[@]}"; do
            response=$(curl -s -o /dev/null -w "%{http_code}" -L "https://of-blood.com$page")
            if [ $response -eq 200 ]; then
              echo "✅ $page - OK" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ $page - Failed (HTTP $response)" >> $GITHUB_STEP_SUMMARY
              failed=1
            fi
          done
          exit $failed
